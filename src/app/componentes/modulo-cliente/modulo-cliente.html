<div class="container-fluid p-4">
  <div class="card shadow">
    <!-- Encabezado de la tarjeta -->
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="m-0">Consulta de Clientes</h5>
      <a routerLink="/formulario-cliente" class="btn btn-primary-custom">
        <i class="bi bi-plus-circle me-2"></i>
        Nuevo Cliente
      </a>
    </div>

    <!-- Cuerpo de la tarjeta -->
    <div class="card-body">
      <!-- Barra de búsqueda -->
      <div class="mb-3">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Buscar cliente por nombre o documento..."
          [(ngModel)]="searchTerm"
          (input)="onSearch()">
      </div>
      <!-- boton buscar -->
      <div class="mb-3 text-end">
        <a class="btn btn-primary-custom" (click)="onSearch()">
          <i class="bi bi-search me-2"></i>
          Buscar
        </a>

      <!-- Tabla de Clientes -->
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th scope="col">id</th>
              <th scope="col">Nombre</th>
              <th scope="col">Documento</th>
              <th scope="col">Teléfono</th>
              <th scope="col">Correo Electrónico</th>
              <!-- <th scope="col">Estado</th> -->
              <th scope="col" class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let client of filteredClients">
              <td>{{ client.idCliente }}</td>
              <td>{{ client.nombre }}</td>
              <td>{{ client.documento }}</td>
              <td>{{ client.telefono }}</td>
              <td>{{ client.email }}</td>
             <!-- <td>
                <span class="status-badge" [ngClass]="getStatusClass(client.estadoCliente?.nombre)">
                  {{ client.estadoCliente?.nombre || 'Desconocido' }}
                </span>
              </td>-->

              <td class="text-center">
                <!-- Botones de acciones -->
                <button (click)="viewClient(client.idCliente)" class="btn btn-sm btn-outline-secondary me-1" title="Ver Detalles">
                  <i class="bi bi-eye-fill"></i>
                </button>
                <a [routerLink]="['/formulario-cliente', client.idCliente]" class="btn btn-sm btn-outline-primary me-1" title="Editar">
                  <i class="bi bi-pencil-fill"></i>
                </a>
                <button (click)="deleteClient(client.idCliente)" class="btn btn-sm btn-outline-danger" title="Eliminar">
                  <i class="bi bi-trash-fill"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
