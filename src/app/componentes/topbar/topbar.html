<nav class="topbar">
  <!-- Botón menú -->
  <button class="menu-toggle-btn" (click)="onMenuClick()">
    <i class="bi bi-list"></i>
  </button>

  <!-- Título -->
  <!-- Título -->
  <div class="brand-container">
    <img src="/Imagenes/icono_protel.webp" alt="Logo" class="topbar-logo">
    <span class="topbar-title">PROTEL</span>
  </div>

  <!-- Iconos a la derecha -->
  <div class="topbar-right">
    <ng-container *ngIf="authService.currentUser | async; else loginTemplate">
      <span class="username-display">Hola, {{ (authService.currentUser | async)?.username }}</span>
      <a (click)="logout()" class="topbar-icon" style="cursor: pointer;" title="Salir">
        <i class="bi bi-box-arrow-right"></i>
      </a>
    </ng-container>
    <ng-template #loginTemplate>
      <a href="/login" class="topbar-icon" title="Ingresar">
        <i class="bi bi-person"></i>
      </a>
    </ng-template>
  </div>
</nav>
