<div class="form-container">
  <div class="card shadow">
    <div class="card-header">
      <h5 class="m-0">Nuevo Estudio de Factibilidad</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="onSubmit()" #factibilidadForm="ngForm" novalidate>
        
        <!-- Nombre del Proyecto -->
        <div class="mb-3">
          <label for="nombreProyecto" class="form-label">Nombre del Proyecto</label>
          <input type="text" class="form-control" id="nombreProyecto" name="nombreProyecto" [(ngModel)]="factibilidad.nombreProyecto" required>
        </div>

        <!-- Cliente (Dropdown) -->
        <div class="mb-3">
          <label for="cliente" class="form-label">Cliente Asociado</label>
          <select class="form-select" id="cliente" name="cliente" [(ngModel)]="factibilidad.idCliente" required>
            <option value="0" disabled>Selecciona un cliente...</option>
            <option *ngFor="let client of clients" [value]="client.idCliente">{{ client.nombre }}</option>
          </select>
        </div>

        <!-- Ubicación -->
        <div class="mb-3">
          <label for="ubicacion" class="form-label">Dirección o Ubicación</label>
          <input type="text" class="form-control" id="ubicacion" name="ubicacion" [(ngModel)]="factibilidad.ubicacion">
        </div>

        <!-- Descripción / Notas -->
        <div class="mb-3">
          <label for="descripcion" class="form-label">Descripción / Notas</label>
          <textarea class="form-control" id="descripcion" name="descripcion" rows="4" [(ngModel)]="factibilidad.descripcion"></textarea>
        </div>

        <!-- Botón de Envío -->
        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-primary-custom" [disabled]="!factibilidadForm.form.valid">
            Guardar Estudio
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
