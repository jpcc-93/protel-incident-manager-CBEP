<div class="card shadow-sm">
  <div class="card-header">
    <h3>Registro de Cliente</h3>
  </div>
  <div class="card-body">
    <p class="card-subtitle mb-4 text-muted">Diligencia la información para registrar un nuevo cliente en el sistema.</p>
    
    <form (ngSubmit)="onSubmit()">
      <div class="row">
        <!-- Columna Izquierda -->
        <div class="col-md-6">
          <div class="mb-3">
            <label for="nombreCliente" class="form-label">Nombre o Razón Social</label>
            <input type="text" class="form-control" id="nombreCliente" name="nombre" [(ngModel)]="cliente.nombre" required>
          </div>
          <div class="mb-3">
            <label for="nitCliente" class="form-label">NIT o Cédula</label>
            <input type="text" class="form-control" id="nitCliente" name="documento" [(ngModel)]="cliente.documento" required>
          </div>
          <div class="mb-3">
            <label for="tipoCliente" class="form-label">Tipo de Cliente</label>
            <select class="form-select" id="tipoCliente" name="tipoCliente" [(ngModel)]="cliente.tipoCliente">
              <option selected>Seleccionar...</option>
              <option value="empresa">Empresa</option>
              <option value="persona">Persona Natural</option>
            </select>
          </div>
        </div>
        <!-- Columna Derecha -->
        <div class="col-md-6">
          <div class="mb-3">
            <label for="personaContacto" class="form-label">Persona de Contacto</label>
            <input type="text" class="form-control" id="personaContacto" name="personaContacto" [(ngModel)]="cliente.personaContacto">
          </div>
          <div class="mb-3">
            <label for="telefonoCliente" class="form-label">Teléfono</label>
            <input type="tel" class="form-control" id="telefonoCliente" name="telefono" [(ngModel)]="cliente.telefono" required>
          </div>
          <div class="mb-3">
            <label for="emailCliente" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="emailCliente" name="email" [(ngModel)]="cliente.email" required>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="direccionCliente" class="form-label">Dirección</label>
        <input type="text" class="form-control" id="direccionCliente" name="direccion" [(ngModel)]="cliente.direccion">
      </div>
      
      <hr>

      <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-secondary me-2">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar Cliente</button>
      </div>
    </form>
  </div>
</div>
